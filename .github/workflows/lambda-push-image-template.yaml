name: Lambda - Push Docker Image Template

on:
  workflow_call:
    inputs:
      image_name:
        description: "Local Docker image name used when the image was built"
        required: true
        type: string

      image_tag:
        description: "Image tag to push"
        required: true
        type: string

      image_artifact_name:
        description: "Artifact name containing the saved Docker image"
        required: true
        type: string

      ecr_repository:
        description: "ECR repository name"
        required: true
        type: string

      aws_region:
        description: "AWS region"
        required: true
        type: string

      aws_role_to_assume:
        description: "AWS role to assume using OIDC"
        required: true
        type: string

      push_latest:
        description: "Also tag and push latest"
        required: false
        type: boolean
        default: true

      environment:
        description: "Optional GitHub environment name"
        required: false
        type: string

    outputs:
      image_uri:
        description: "Full pushed ECR image URI"
        value: ${{ jobs.push-image.outputs.image_uri }}

jobs:
  push-image:
    name: push-image
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment || '' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      image_uri: ${{ steps.image_uri.outputs.image_uri }}

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_artifact_name }}

      - name: Load Docker image
        run: |
          docker load -i "${{ inputs.image_artifact_name }}.tar"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR image URI
        id: image_uri
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Image URI: $IMAGE_URI"

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            "${{ inputs.image_name }}:${{ inputs.image_tag }}" \
            "${{ steps.image_uri.outputs.image_uri }}"

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image_uri.outputs.image_uri }}"

      - name: Tag and push latest
        if: ${{ inputs.push_latest }}
        run: |
          docker tag \
            "${{ inputs.image_name }}:${{ inputs.image_tag }}" \
            "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest"

          docker push \
            "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest"