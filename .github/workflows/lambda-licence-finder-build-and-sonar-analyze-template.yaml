name: Licence finder Lambda - Build and sonar analyze template
on:
  workflow_call:
    inputs:
      dotnet_application_solution_name:
        description: "dotnet application solution name"
        required: true
        type: string
      environment:
        description: "Optional environment name"
        required: false
        type: string
    
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  build-and-sonar-analyze:
    name: build-and-sonar-analyze
    runs-on: windows-latest
    environment: ${{ inputs.environment || '' }}
    permissions:
      id-token: write
      contents: read
    outputs:
      should_push: ${{ steps.check_commit.outputs.should_push }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Delete tessdata folder
        run: |
          cd WRADI.Lambda.LicenceFinder.EntryPoint/tessdata
          rm configs
          rm frk.traineddata
          rm pdf.ttf          

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Extract short SHA
        id: shortsha
        shell: pwsh
        run: |
          "shortsha=$($env:GITHUB_SHA.Substring(0, 8))" >> $env:GITHUB_OUTPUT

      - name: Check last commit message for 'ecrpush'
        id: check_commit
        shell: bash
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          echo "Last commit message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"ecrpush"* ]]; then
            echo "should_push=true"
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false"
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi


      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore ${{ inputs.dotnet_application_solution_name }}.sln
      - name: Build Solution
        shell: pwsh
        run: dotnet build ${{ inputs.dotnet_application_solution_name }}.sln --configuration Release

     
      - name: List coverage files
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter "*.coverage.opencover.xml"; Get-ChildItem -Recurse -Filter "*.test_results.trx"
      #- name: End Sonar Analysis
      #  shell: pwsh
      #  env:
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #  run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
